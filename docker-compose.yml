services:
  # Nginx 服务
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./:/var/www/html
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - php
    networks:
      - app-network

  # PHP 8.4 服务（带 mbstring 和 redis 扩展）
  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: php
    volumes:
      - ./:/var/www/html
    command: >
      bash -c "
        composer install --no-interaction --prefer-dist &&
        chmod -R 777 /var/www/html/storage /var/www/html/bootstrap/cache && # Force permissions again
        php artisan key:generate --ansi && # Generate app key if not exists
        php artisan migrate --force && # Run migrations
        php artisan storage:link && # Create storage symlink
        php-fpm # Start PHP-FPM
        "
    networks:
      - app-network
    depends_on:
      mysql:
        condition: service_healthy # 只有当 mysql 容器健康检查通过后才启动 php

  # Node.js 20 服务
  node:
    image: node:20
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - app-network

  # MySQL 服务
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: recipe
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"] # 使用root用户密码测试连接
      interval: 10s # 每10秒检查一次
      timeout: 5s   # 每次检查超时5秒
      retries: 5    # 失败后重试5次
      start_period: 30s # 容器启动后，等待30秒再开始第一次检查 (给MySQL初始化时间)

  # Redis 服务
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network

# 网络定义
networks:
  app-network:
    driver: bridge

# 卷定义
volumes:
  mysql_data:
